name: "Hybrid AI Job Hunter Auto-Scan"

on:
  schedule:
    # Exécution automatique 3x par jour : 07h00, 11h00 et 16h00 UTC (soit 08h, 12h, 17h heure locale)
    - cron: '0 7,11,16 * * *'
  workflow_dispatch: # Permet de lancer le scan manuellement en 1 clic depuis GitHub

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Installer les dépendances
        run: npm install

      - name: 🌐 Installer Chromium Playwright
        run: npx playwright install --with-deps chromium

      - name: 🗄️ Générer le client Prisma
        run: npx prisma generate

      - name: 🚀 Lancer le scan multi-réseaux et l'IA
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_C_USER: ${{ secrets.FB_C_USER }}
          FB_XS: ${{ secrets.FB_XS }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: npx tsx src/scripts/cron-scan.ts
